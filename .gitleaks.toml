# Gitleaks configuration.
#
# Tuning a secret scanner is mostly about the allowlist. An untuned scanner
# produces enough noise that people start passing --no-verify, at which point
# the control is worse than absent. Every exclusion below is narrow and carries
# the reason it is safe.

[extend]
# Start from the bundled ruleset instead of reinventing ~150 provider patterns,
# then add what is specific to this repository.
useDefault = true

[[rules]]
id = "cosign-private-key"
description = "Cosign private key material committed to the repository"
# Cosign wraps its key in an ENCRYPTED SIGSTORE PRIVATE KEY block. The demo
# generates one under artifacts/, which is ignored by git; anything matching
# this outside artifacts/ means a signing key reached the working tree.
regex = '''-----BEGIN ENCRYPTED SIGSTORE PRIVATE KEY-----'''
keywords = ["SIGSTORE PRIVATE KEY"]

[[rules]]
id = "kubeconfig-embedded-credential"
description = "kubeconfig with inline client certificate or token"
# A kubeconfig in a repository is a cluster credential with no expiry and no
# audit trail. The base64 payload is what makes it usable, so that is what is
# matched.
regex = '''(?i)(client-key-data|token):\s*[A-Za-z0-9+/=_\-\.]{40,}'''
keywords = ["client-key-data", "token:"]

[[rules]]
id = "registry-auth-in-dockerconfig"
description = "Docker registry credentials embedded in a config file"
regex = '''(?i)"auths"\s*:\s*\{[^}]*"auth"\s*:\s*"[A-Za-z0-9+/=]{16,}"'''
keywords = ["auths", "auth"]

[allowlist]
description = "Paths and values that cannot contain a real credential"

paths = [
  # Build output: SBOMs, scanner reports, exported image tarballs and the
  # ephemeral demo signing key. Ignored by git, regenerated by every run.
  '''^artifacts/''',
  # Scanner database caches.
  '''^\.cache/''',
  # The hash-pinned lockfile is thousands of sha256 digests. They are integrity
  # checks, not secrets, and they trip generic high-entropy rules.
  '''^app/requirements\.txt$''',
]

regexes = [
  # The demo signs against a throwaway local registry with a fixed password
  # that grants access to nothing. It is documented in the README as a demo
  # value; treating it as a finding trains people to ignore findings.
  '''COSIGN_PASSWORD=demo''',
  # Public key material is meant to be published.
  '''-----BEGIN PUBLIC KEY-----''',
]

stopwords = [
  "example",
  "placeholder",
]
