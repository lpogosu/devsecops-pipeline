# Repository-owned static-analysis rules.
#
# These are checked in rather than pulled from the registry so the gate cannot
# change under the team's feet, and so an offline run still produces a verdict.
# Every rule states the risk it mitigates, not what the pattern matches.

rules:
  - id: subprocess-with-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      shell=True hands the argument string to /bin/sh, so any value that reaches
      it from a request, a filename or a CI variable becomes command injection.
      Pass a list of arguments instead; the exec path never involves a shell.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: os.system(...)

  - id: tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      Disabling certificate verification turns TLS into obfuscation: anything on
      the path can read and rewrite the traffic, and in a build pipeline that
      path is exactly where a dependency-substitution attack lands. Fix the
      trust store instead of switching the check off.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD(..., verify=False, ...)
          - pattern: httpx.$METHOD(..., verify=False, ...)
          - pattern: ssl._create_unverified_context(...)

  - id: yaml-load-without-safe-loader
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load with the default loader instantiates arbitrary Python objects
      from the document. Policy files, SBOMs and scanner reports are all YAML
      that arrives from outside this repository, so use yaml.safe_load.
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
    patterns:
      - pattern: yaml.load($DATA)

  - id: provenance-fallback-must-be-empty
    languages: [python]
    severity: ERROR
    message: >-
      Build provenance must degrade to an empty string when the image was not
      stamped. A plausible-looking default (a fake commit, "unknown", "dev")
      makes an unattested image indistinguishable from an attested one at the
      exact moment somebody is trying to answer "what is running in prod".
    metadata:
      confidence: HIGH
    patterns:
      - pattern: os.environ.get("$KEY", $DEFAULT)
      - metavariable-regex:
          metavariable: $KEY
          regex: ^OCI_(SOURCE|REVISION|CREATED)$
      - pattern-not: os.environ.get("$KEY", "")
