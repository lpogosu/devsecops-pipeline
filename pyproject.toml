# Tooling configuration only. Nothing here is published as a package: the
# deliverable of this repository is a pipeline, not a library.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "pipeline"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "S",         # flake8-bandit: the static security checks, so a separate
               # bandit run is not needed on top of semgrep
  "ANN",       # missing annotations
  "RUF",
]
ignore = [
  # ANN101/ANN102 (self, cls) were removed upstream; nothing else is silenced.
]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipeline"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the point. Hard-coded fixture values in tests are not
# credentials.
"**/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["app", "pipeline"]
exclude = "(^|/)artifacts/"
# `app` and `pipeline` are namespace packages rooted at the repository, not
# installed distributions; without this mypy resolves app/main.py twice.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# The service is exercised through FastAPI's test client; its own annotations
# are complete, but the pytest fixtures reload modules, which mypy cannot model.
module = "app.tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["app/tests", "pipeline/tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
