apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-metadata
  namespace: demo
  labels:
    app.kubernetes.io/name: release-metadata
    app.kubernetes.io/part-of: devsecops-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: release-metadata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-metadata
    spec:
      # No workload here talks to the API server, and a mounted token is a
      # ready-made credential for anything that gets code execution in the pod.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Digest, not tag: admission verifies a signature over these exact
          # bytes, and a tag can be moved after that check passes.
          image: ghcr.io/lpogosu/devsecops-pipeline/release-metadata@sha256:de0d6fb55fee5ca78a134d79459d7c8f17472ae3a99d69f8d472d91946b2c96c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            # The root filesystem is read-only, so anything that needs to write
            # gets an explicit, size-bounded volume instead.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
